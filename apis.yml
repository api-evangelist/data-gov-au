aid: data-gov-au

name: data.gov.au Federal

description: data.gov.au Federal is the Australian Government's national open-data portal, run on CKAN and (per its own maintenance notice) operated
  under the Australian Bureau of Statistics. It exposes the CKAN Action API, a standardized machine-readable JSON interface over approximately
  132,257 datasets, supporting programmatic dataset search, metadata retrieval, and resource access. Because it runs CKAN, it shares a consistent
  API surface with every other CKAN portal, making it uniformly harvestable and integrable. Its CKAN extensions (ckanext-datagovau and others)
  are published in the datagovau GitHub organization.

