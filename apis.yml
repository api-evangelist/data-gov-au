x-coverage:
  state: covered
  reason: maintenance
  detail: Identity pass 2026-10-21. Every data.gov.au URL (/, /data, /data/api/3/action/status_show, www.) returned HTTP 503 with a maintenance
    page titled "Australian Bureau of Statistics" stating "Data.gov.au is currently undergoing maintenance. We'll be back online on 22 October
    2026." The pre-flight graded this 503 as a bot-challenge; the body shows it is scheduled maintenance, so existing data.gov.au pointers were
    kept (not dead) and no new on-site pointers (terms, privacy, support) could be verified or added. GitHub org datagovau verified (links to
    data.gov.au, hosts ckanext-datagovau).
  evidence:
  - url: https://data.gov.au/data
    status: 503
  - url: https://data.gov.au/
    status: 503
  - url: https://data.gov.au/data/api/3/action/status_show
    status: 503
  - url: https://docs.ckan.org/en/latest/api/
    status: 200
  - url: https://github.com/datagovau
    status: 200
