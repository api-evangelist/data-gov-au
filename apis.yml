apis:
- aid: data-gov-au:catalog
  name: data.gov.au Federal CKAN Action API
  description: CKAN Action API for data.gov.au Federal, a consistent JSON-over-HTTP interface over a catalog of 132,257 datasets. Standard actions
    include package_search, package_show, package_list, organization_list, group_list, tag_list, and resource_search; datastore_search is available
    where the DataStore extension is enabled. Base URL https://data.gov.au/data/api/3/action/.
